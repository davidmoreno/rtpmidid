# rtpmidid.ini for Akai MPC standalone devices.
#
# The daemon exports the MPC's own MIDI ports to RTP-MIDI and exposes every
# RTP-MIDI endpoint found on the LAN as an ALSA sequencer port. The MPC
# application lists ALSA sequencer clients as MIDI inputs, so a discovered peer
# shows up in its MIDI pages without anything else being configured.

[general]
alsa_name=rtpmidid
# The unit sets RuntimeDirectory=rtpmidid, so this exists before we start.
control=/run/rtpmidid/control.sock
log_level=info

# Announce this MPC as an RTP-MIDI endpoint ("mpc-one.local:5004" on the wire).
# Roughly the same thing Apple calls "Network MIDI" / an RTP-MIDI session.
[rtpmidi_announce]
name={{hostname}}
port=5004

# Accept every announcement found on the network. Narrow this if the same LAN
# has endpoints you never want to see on the device, for example:
#   name_positive_regex=(Ableton|Peak)
[rtpmidi_discover]
enabled=true
# Peers also announce their own ALSA system clients (System-Announce,
# System-Timer, "Midi Through"); they never accept a session, so on the MPC they
# would only clutter the MIDI input list. Drop anything that looks like one;
# widen this (^$) if you want to see them anyway.
name_negative_regex=(System|Midi Through)
name_positive_regex=.*
# The MPC has no NSS mDNS support, so "<host>.local" cannot be resolved with
# getaddrinfo(): connect to the address mDNS resolved instead.
address_from_mdns=true

# A plain ALSA port ("Network Export") that sends whatever is connected to it to
# the network.
[alsa_announce]
name=Network Export

# Export the MPC's own hardware MIDI ports to the network as well.
#
# Careful with the MPC application: it wants exclusive use of its own MIDI ports
# (kernel client "MPC One MIDI", ports "MPC Studio Live Public/Private/MIDI
# Port"), and it is the one that owns the DIN and USB-host MIDI. Announcing them
# here makes rtpmidid subscribe to those ports next to the MPC app, which is what
# broke it. They are excluded below, together with the ALSA system clients (not
# connectable, they only produce "Operation not permitted" errors here).
#
# This section uses std::regex_match, i.e. the WHOLE name has to match, so the
# .* on both sides are required. Names look like "MPC One MIDI-MPC Studio Live
# Public" or "System-Timer". A USB keyboard plugged into the MPC is still
# exported; add its name here if you want to keep it local.
#
# Comment out the section to keep the MPC receive-only.
[alsa_hw_auto_export]
name_positive_regex=.*
name_negative_regex=.*(System|Timer|Announce|Midi Through|MPC|Studio Live|JUCE).*
type=hardware
