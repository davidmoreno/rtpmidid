# avahi-daemon.conf used by the avahi bundled with the rtpmidid MPC package.
# passed with -f, because /etc is read-only on these devices and we do not want
# to depend on whatever a device happens to have.
[server]
use-ipv4=yes
# IPv6 is off by default: the MPC network stack is IPv4 through connman, and
# RTP-MIDI peers here are reached over IPv4. Flip it on if you need it.
use-ipv6=no
enable-dbus=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no

[reflector]
enable-reflector=no
