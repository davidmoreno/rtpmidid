# example ini file for rtpmidid
[general]
alsa_name=rtpmidid
# Real-time scheduling for the data-plane actors (peers, router):
# SCHED_FIFO at rt_priority (needs RLIMIT_RTPRIO / CAP_SYS_NICE; falls
# back to nice-based elevation with a warning when unavailable).
#rt_enable=true
#rt_priority=10
control=/var/run/rtpmidid/control.sock
log_level=info
# Colorize the log keys: never | always | auto (auto = color when stdout is a
# terminal). NO_COLOR=1 disables, FORCE_COLOR=1 forces, regardless of this.
#log_color=auto

## All announce sections and connect_to can appear several times.

# RTPMIDI announcement requires a firewall rule to allow incoming
# connections on port 5004. If you want to not have an rtpmidi_announce
# section, comment it out or delete it.
# This creates an announced rtpmidi endpoint, and any connection
# will create a new ALSA port.
[rtpmidi_announce]
name={{hostname}}
port=5004

# RTPMIDI discover
# Discovered servers become *waiting* ALSA ports (lazy connections): no
# network session is opened until an ALSA client subscribes to the port,
# and the session is closed again on the last unsubscribe.
# Some rules to just don't accept any announcements. If do not pass the rules,
# no ALSA port will be created to allow easy connect to the other side.
# name will be "servername:port/service". But as they are regex, just write the
# part you are interested in: for example:
#
#  name_positive_regex=.* # will accept any name
#  name_positive_regex=:5004/ # will accept any at port 5004
#  name_positive_regex=(Peak|Ableton) # will accept only Peak or Ableton, any host any port
#  name_negative_regex=.* # will reject any other name
#
# The check order is:
#  1. First we check the negative regex, if match reject. 
#  2. Then the positive. If match accept.
#  3. If no positive match, reject.
#
# If you really need to reject and accept by name in a serious way, the regex should 
# be complete, with ^ and $. For example:
#
#  name_positive_regex=^(raspberry.local:5004/HYDRASYNTH KB-HYDRASYNTH KB MIDI 1)$
#
[rtpmidi_discover]
# enabled = true|false
enabled=true
# by default negative does nothing
name_negative_regex=^$
# and we accept everything
name_positive_regex=.*

# Alsa announcement requires no firewall as it creates random
# ports for each connection. If you want to not have an alsa_announce
# section, comment it out or delete it.
[alsa_announce]
# Name for the ALSA connection so that when a connection is made, an rtpmidi
# is announced.
name=Network Export


# and now some fixed connections.
# Connections are lazy: each [connect_to] creates a waiting ALSA port
# named after the section; the rtpmidi session starts on the FIRST ALSA
# subscription to that port (e.g. aconnect some source to it) and ends on
# the LAST unsubscribe. Nothing is connected at daemon startup.
# [connect_to]
# hostname=192.168.1.33
# port=5004
# name=DeepMind12D

# [connect_to]
# hostname=192.168.1.210
# # default port is 5004
# name=midid
# local_udp_port = 5010

# enable automatic export of devices to rtpmidi, by name regex and type. Comment full section to disable.
# Each matching local sequencer port gets its own rtpmidi export (own
# listen port + mDNS announcement, named "<client> <port>"); ports
# appearing/disappearing at runtime are tracked. The daemon's own ports
# are never exported. When a remote connects, the port is subscribed for
# the duration of that connection only.
[alsa_hw_auto_export]
name_positive_regex=.*
name_negative_regex=(System|Timer|Announce)
# hardware | software | all | none. Default none, so set to hardware normally.
type=hardware


#[rawmidi]
## This is the ALSA rawmidi device that will be exported to rtpmidi.
## name is the name of the exported device. If not set try to get from RAW ALSA midi
## or use the device name.
#name=MIDI C4D0
## device is the rawmidi device to export. It can be or not a ALSA raw midi.. of a FIFO, or Serial... anything.
#device=/dev/snd/midiC4D0
## Server mode (hostname empty): the device is registered and announced,
## but NEVER opened while idle (exclusive access stays free for other
## programs). The device opens when a remote connects and closes when the
## connection ends.
## hostname=
#local_udp_port=5104
## Client mode: set hostname to connect to a remote server eagerly at
## startup; the device is opened and the session held for the daemon's
## lifetime.
## hostname=raspberrypi.local
## remote_udp_port=5004
