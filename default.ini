# example ini file for rtpmidid
[general]
alsa_name=rtpmidid
control=/var/run/rtpmidid/control.sock
log_level=info

# Web UI: static files + WebSocket JSON-RPC (same protocol as rtpmidid-cli).
# After `make install` / packages: /usr/share/rtpmidid/html (see Makefile).
[web]
enabled=true
listen=127.0.0.1
# listen=0.0.0.0 # for public access
port=8089
root=frontend/dist
#username=
#password=

# Persist router connections between runs (device identity sides, not peer numbers).
[database]
path=build/rtpmidid.db

# Repeatable: [peer] and [connect]. Each [peer] needs identity= (key=value grammar).
# RTP-MIDI multi-listener (incoming RTP → new ALSA ports). Firewall must allow UDP port.
[peer]
identity=rtpmidi_multi:name={{hostname}},port=5004

# ALSA "Network Export" (incoming ALSA subscription → RTP per connection).
[peer]
identity=alsa_multi:name=Network Export

# Raw MIDI ↔ RTP bridge (two peers + two directed connects):
# [peer]
# identity=rawmidi:device=/dev/snd/midiC4D0,name=MIDI Export
# [peer]
# identity=rtpmidi_server:name=MIDI Export,port=5104
# [connect]
# from=rawmidi:device=/dev/snd/midiC4D0,name=MIDI Export
# to=rtpmidi_server:name=MIDI Export,port=5104
# [connect]
# from=rtpmidi_server:name=MIDI Export,port=5104
# to=rawmidi:device=/dev/snd/midiC4D0,name=MIDI Export

# ALSA listener → remote RTP client (lazy connect on ALSA subscription):
# [peer]
# identity=alsa_listener:service=DeepMind12D,hostname=192.168.1.33,port=5004
# [peer]
# identity=rtpmidi_client:hostname=192.168.1.33,service=DeepMind12D,port=5004

[rtpmidi_discover]
enabled=true
name_negative_regex=^$
name_positive_regex=.*

[alsa_hw_auto_export]
name_positive_regex=.*
name_negative_regex=(System|Timer|Announce)
type=hardware
