# example ini file for rtpmidid
[general]
alsa_name=rtpmidid
control=/var/run/rtpmidid/control.sock
log_level=info

# Web UI: static files + WebSocket JSON-RPC (same protocol as rtpmidid-cli).
# After `make install` / packages: /usr/share/rtpmidid/html (see Makefile).
[web]
enabled=true
listen=127.0.0.1
port=8089
root=frontend/dist
#username=
#password=

# Repeatable: [peer], [connect], [bridge]. Each [peer] needs id= and type=.
# RTP-MIDI multi-listener (incoming RTP → new ALSA ports). Firewall must allow UDP port.
[peer]
id=announce_main
type=listen_rtpmidi
name={{hostname}}
port=5004

# ALSA “Network Export” (incoming ALSA subscription → RTP per connection).
[peer]
id=alsa_net_export
type=listen_alsa_network
name=Network Export

# Raw MIDI ↔ RTP examples (commented). Use two [peer] + two [connect], or one [bridge].

# [peer]
# id=hw_raw
# type=rawmidi
# device=/dev/snd/midiC4D0
# name=MIDI Export
# [peer]
# id=rtp_listen
# type=rtpmidi_listen
# name=MIDI Export
# local_udp_port=5104
# [connect]
# from=hw_raw
# to=rtp_listen
# [connect]
# from=rtp_listen
# to=hw_raw

# [bridge]
# local.id=hw_raw
# local.type=rawmidi
# local.device=/dev/snd/midiC4D0
# local.name=MIDI Export
# remote.id=rtp_listen
# remote.type=rtpmidi_listen
# remote.name=MIDI Export
# remote.local_udp_port=5104

# ALSA port → join remote RTP-MIDI host:
# [bridge]
# local.id=alsa1
# local.type=alsa_listener
# local.name=DeepMind12D
# remote.id=rtp1
# remote.type=rtpmidi_connect
# remote.hostname=192.168.1.33
# remote.port=5004
# remote.local_udp_port=

[rtpmidi_discover]
# enabled = true|false
enabled=true
name_negative_regex=^$
name_positive_regex=.*

[alsa_hw_auto_export]
name_positive_regex=.*
name_negative_regex=(System|Timer|Announce)
type=hardware
